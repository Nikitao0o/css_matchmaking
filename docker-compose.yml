services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matchuser
      POSTGRES_PASSWORD: matchpass
      POSTGRES_DB: matchdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchuser -d matchdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql://matchuser:matchpass@db:5432/matchdb
      RCON_HOST: ${RCON_HOST}
      RCON_PORT: ${RCON_PORT}
      RCON_PASSWORD: ${RCON_PASSWORD}
      GAME_SERVER_HOST: ${GAME_SERVER_HOST}
      GAME_SERVER_PORT: ${GAME_SERVER_PORT}
      STEAM_API_KEY: ${STEAM_API_KEY}
      STEAM_REDIRECT_URI: ${STEAM_REDIRECT_URI}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./css_matchmaking_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata: